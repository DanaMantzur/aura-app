<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>לנשום במעמקים - Aura Squad</title>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.3);
            --ice-blue: #cbe3f0;
            --pearl-glow: rgba(203, 227, 240, 0.8);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: #0a1128;
            background-image: url('underwater-bg.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* שכבת החושך - מסתירה את התמונה בהתחלה */
        #darkness-overlay {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: rgba(4, 9, 20, 0.85); 
            z-index: 2; 
            pointer-events: none;
            transition: opacity 1s ease-in-out;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            max-width: 480px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 5; 
        }

        /* אנימציית הבועות */
        .bubble {
            position: absolute;
            bottom: -20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            animation: rise linear infinite;
            pointer-events: none; 
            z-index: -1; 
        }

        @keyframes rise {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) scale(1.5); opacity: 0; }
        }

        /* אלמנטים של הממשק (HUD) */
        .top-bar {
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: flex-start;
            z-index: 10;
        }

        .inventory-badge {
            background: rgba(10, 17, 40, 0.85); 
            border: 2px solid var(--ice-blue); 
            padding: 10px 20px; 
            border-radius: 20px;
            backdrop-filter: blur(10px);
            font-weight: bold;
            font-size: 18px; 
            color: #ffffff; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5), 0 0 15px rgba(203, 227, 240, 0.3); 
            margin-right: 15px; 
            opacity: 0;
            transition: opacity 0.5s;
        }

        /* דמות ודיאלוג מוארים */
        .character-container {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .jellyfish-avatar {
            width: 120px;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(203, 227, 240, 0.5));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .dialogue-box {
            background: rgba(15, 27, 50, 0.95); 
            border: 2px solid var(--ice-blue); 
            border-radius: 15px;
            padding: 20px;
            margin: 20px;
            text-align: center;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 35px rgba(203, 227, 240, 0.5); 
            max-width: 90%;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: opacity 1s;
        }

        .dialogue-text {
            font-size: 18px;
            line-height: 1.4;
            margin-bottom: 15px;
            color: #ffffff; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .choice-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid var(--ice-blue);
            color: #ffffff;
            font-weight: bold;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }

        .choice-btn:hover { 
            background: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 15px rgba(203, 227, 240, 0.4);
        }

        /* פניני הנשימה */
        .pearls-area {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 5; 
        }

        .pearl {
            position: absolute;
            width: 45px; height: 45px;
            background: radial-gradient(circle, #fff 0%, var(--ice-blue) 70%, transparent 100%);
            border-radius: 50%;
            cursor: pointer;
            pointer-events: auto;
            opacity: 0;
            transform: scale(0);
            transition: opacity 0.5s;
            animation: breatheAndDrift 5.5s infinite ease-in-out;
        }

        .pearl.collected {
            transform: scale(1.5) !important;
            opacity: 0 !important;
            pointer-events: none;
            animation: none; 
        }

        @keyframes breatheAndDrift {
            0% { box-shadow: 0 0 10px var(--pearl-glow); transform: scale(0.8) translate(0px, 0px); }
            33% { transform: scale(1.0) translate(25px, -30px); }
            50% { box-shadow: 0 0 30px var(--pearl-glow); transform: scale(1.2) translate(-15px, -50px); }
            66% { transform: scale(1.0) translate(-35px, -20px); }
            100% { box-shadow: 0 0 10px var(--pearl-glow); transform: scale(0.8) translate(0px, 0px); }
        }

        /* סצנת סיום */
        #scene2-content {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: 30px;
            animation: fadeIn 2s forwards;
            z-index: 10;
        }

        .ending-box {
            background: rgba(10, 17, 40, 0.8);
            padding: 30px 20px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            border: 3px solid var(--ice-blue); 
            box-shadow: 0 0 25px rgba(203, 227, 240, 0.5); 
            margin-bottom: 25px;
            width: 90%;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    </style>
</head>
<body>

    <audio id="bg-audio" loop>
        <source src="underwater.mp3" type="audio/mpeg">
    </audio>

    <div id="darkness-overlay"></div>

    <div id="game-container">
        
        <div id="scene1-content" style="width: 100%; height: 100%;">
            <div class="top-bar">
                <div class="inventory-badge" id="inventory">פנינים: 0/5</div>
            </div>

            <div class="character-container">
                <img src="jellyfish.png" class="jellyfish-avatar" onerror="this.style.display='none'">
                
                <div class="dialogue-box" id="d-box">
                    <div class="dialogue-text" id="d-text"></div>
                    <div class="choices-container" id="d-choices"></div>
                </div>
            </div>

            <div class="pearls-area" id="pearls-container"></div>
        </div>

        <div id="scene2-content">
            <img src="jellyfish.png" class="jellyfish-avatar" style="width: 150px; margin-bottom: 20px;" onerror="this.style.display='none'">
            <div class="ending-box">
                <h2 style="color: var(--ice-blue); margin-bottom: 15px; font-size: 28px;">הגענו אל האור!</h2>
                <p style="font-size: 18px; line-height: 1.5; color: #ffffff;" id="ending-text"></p>
            </div>
            <button class="choice-btn" style="padding: 15px 30px; font-weight: bold; background: rgba(15, 27, 50, 0.9);" onclick="window.location.href='index.html'">חזרה לתפריט הראשי</button>
        </div>

    </div>

    <script>
        const dialogueTexts = {
            intro: "הים מאוד סוער היום וחשוך כאן.. עזרתך נדרשת באיסוף 5 פניני נשימה כדי להאיר את קרקעית הים! שנתחיל?",
            choice1: "בטח אפשר להתחיל",
            choice2: "אני קצת בלחץ בעצמי",
            response1: "מעולה לעקוב אחר הקצב שלי, לקחת אוויר ונתחיל, יש ללחוץ על הפנינים שהן מוארות ולאסוף אותן.",
            response2: "זה בסדר גמור, לאט לאט. האיסוף הוא פנינה אחת בכל פעם, זה אפילו מרגיע ואז מתגלה העולם.",
            ending: "הצלחת!! הארת את המעמקים. חשוב לזכור: תמיד יש אור מבפנים כשעוצרים לנשום"
        };

        let collectedPearls = 0;
        const totalPearls = 5;
        
        const dText = document.getElementById('d-text');
        const dChoices = document.getElementById('d-choices');
        const inventory = document.getElementById('inventory');
        const pearlsContainer = document.getElementById('pearls-container');
        const bgAudio = document.getElementById('bg-audio');
        const darknessOverlay = document.getElementById('darkness-overlay');

        function startGame() {
            dText.innerText = dialogueTexts.intro;
            dChoices.innerHTML = `
                <button class="choice-btn" onclick="handleChoice(1)">${dialogueTexts.choice1}</button>
                <button class="choice-btn" onclick="handleChoice(2)">${dialogueTexts.choice2}</button>
            `;
            createBubbles(); 
        }

        function createBubbles() {
            const container = document.getElementById('game-container');
            for(let i=0; i<15; i++) {
                let bubble = document.createElement('div');
                bubble.classList.add('bubble');
                let size = Math.random() * 20 + 10; 
                bubble.style.width = size + 'px';
                bubble.style.height = size + 'px';
                bubble.style.left = Math.random() * 100 + 'vw'; 
                bubble.style.animationDuration = Math.random() * 5 + 5 + 's'; 
                bubble.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(bubble);
            }
        }

        function handleChoice(choiceNum) {
            dChoices.innerHTML = ''; 
            
            bgAudio.play().catch(e => console.log("הסאונד דורש קובץ קיים בשם underwater.mp3 בתיקייה"));

            if (choiceNum === 1) {
                dText.innerText = dialogueTexts.response1;
            } else {
                dText.innerText = dialogueTexts.response2;
            }

            inventory.style.opacity = '1';
            setTimeout(spawnPearls, 2000); 
        }

        function spawnPearls() {
            const positions = [
                { top: '65%', left: '20%', delay: '0s' },
                { top: '25%', left: '75%', delay: '1s' },
                { top: '50%', left: '80%', delay: '2s' },
                { top: '75%', left: '60%', delay: '0.5s' },
                { top: '35%', left: '15%', delay: '1.5s' }
            ];

            positions.forEach((pos, index) => {
                const pearl = document.createElement('div');
                pearl.classList.add('pearl');
                pearl.style.top = pos.top;
                pearl.style.left = pos.left;
                pearl.style.animationDelay = pos.delay; 
                
                setTimeout(() => { pearl.style.opacity = '1'; }, index * 500);
                pearl.onclick = () => collectPearl(pearl);
                
                pearlsContainer.appendChild(pearl);
            });
            
            setTimeout(() => { 
                const dBox = document.getElementById('d-box');
                dBox.style.opacity = '0'; 
                setTimeout(() => dBox.style.display = 'none', 1000);
            }, 3000);
        }

        function collectPearl(pearlElement) {
            pearlElement.classList.add('collected'); 
            collectedPearls++;
            inventory.innerText = `פנינים: ${collectedPearls}/${totalPearls}`;
            
            const newOpacity = Math.max(0, 0.85 - (collectedPearls * 0.17));
            darknessOverlay.style.opacity = newOpacity;

            if (collectedPearls === totalPearls) {
                setTimeout(transitionToScene2, 1000);
            }
        }

        function transitionToScene2() {
            document.getElementById('scene1-content').style.display = 'none';
            const scene2 = document.getElementById('scene2-content');
            scene2.style.display = 'flex';
            document.getElementById('ending-text').innerText = dialogueTexts.ending;
        }

        window.onload = startGame;

    </script>
</body>
</html>
